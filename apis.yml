aid: yubi
name: Yubi
description: >-
  Yubi (formerly CredAvenue) is an Indian debt and credit technology company
  operating a full-stack digital marketplace that connects enterprises, lenders,
  and investors across India's credit ecosystem. Its product suite spans Yubi
  Loans for corporate borrowing, Yubi Co.Lend for bank/NBFC co-lending
  partnerships with one-time API integration, Yubi Pools for securitisation and
  ABS deal-making, Yubi Invest for fixed-income and debt investing, and Yubi
  Flow for supply-chain financing. Founded in 2020 and headquartered in Chennai,
  the company reached unicorn status in 2022 and exposes self-serve APIs for
  co-lending and loan-origination data exchange through its developer portal at
  developer.go-yubi.com. This profile was seeded from the Lightspeed Venture
  Partners portfolio and enriched from Yubi's public web surface.
